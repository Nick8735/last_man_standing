<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Man Standing Organiser</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--text:#16211a;--muted:#667267;--accent:#1f8a4c;--accent-t:#fff;--danger:#c0392b;--border:#dde3dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111813;--card:#1a241d;--text:#e8efe9;--muted:#93a095;--accent:#34b36b;--accent-t:#06150c;--danger:#e8604f;--border:#2c3a30}}
:root[data-theme="dark"]{--bg:#111813;--card:#1a241d;--text:#e8efe9;--muted:#93a095;--accent:#34b36b;--accent-t:#06150c;--danger:#e8604f;--border:#2c3a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:24px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.stats{display:flex;gap:8px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem}
.stat span{color:var(--muted);font-size:.8rem}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:1rem}
button{padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.95rem;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button.win.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button.out.on{background:var(--danger);color:#fff;border-color:var(--danger)}
button.link{border:0;background:none;color:var(--muted);padding:4px 8px;font-size:.85rem}
.player{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.player .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.player .name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:.75rem;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px 8px;color:var(--muted)}
.elim{opacity:.75}
.banner{background:var(--accent);color:var(--accent-t);padding:14px;border-radius:10px;text-align:center;font-weight:600;margin-bottom:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:.8rem;border-radius:99px;padding:2px 10px;background:var(--bg);border:1px solid var(--border)}.badge.win{background:var(--accent);color:var(--accent-t)}.badge.out{background:var(--danger);color:#fff}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.empty{color:var(--muted);text-align:center;padding:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:url("https://logodownload.org/wp-content/uploads/2016/03/premier-league-0.png") center 40%/min(80vw,520px) no-repeat;opacity:.12}
@media (prefers-color-scheme:dark){body::before{opacity:.08}}
main{position:relative}
</style>
</head>
<body>
<main>
  <h1>⚽ Last Man Standing</h1>
  <p class="sub">Pick a team, win to survive, and you can't pick the same team twice.</p>
  <div id="app"></div>
</main>
<script>
// 1) Paste your Firebase Realtime Database URL between the quotes (no trailing slash).
//    Leave empty to run in single-browser mode.
const DB="https://last-man-standing-7a8b8-default-rtdb.europe-west1.firebasedatabase.app";

const KEY="lms-v1";
let S={week:1,players:[]};
let loadFailed=false;
let pw="";try{pw=localStorage.getItem("lms-pw")||""}catch(e){}
let admin=DB?!!pw:true;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const alive=()=>S.players.filter(p=>p.outWeek==null);
const norm=t=>t.trim().toLowerCase();
const tidy=()=>{
  S.players=(S.players||[]).filter(Boolean);
  S.players.forEach(p=>{const o={};const src=p.picks||{};Object.keys(src).forEach(k=>{if(src[k])o[k]=src[k]});p.picks=o});
};

async function load(){
  try{
    if(!DB){const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}
    else{const r=await fetch(DB+"/lms/public.json");const d=await r.json();if(d&&!d.error)S=d;else if(d&&d.error)loadFailed=true}
  }catch(e){loadFailed=true}
  tidy();
}
async function save(){
  if(!DB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return true}
  try{
    const r=await fetch(DB+"/lms.json",{method:"PUT",body:JSON.stringify({key:pw,public:S})});
    if(!r.ok)throw 0;return true;
  }catch(e){alert("Couldn't save. Check your password and database URL.");return false}
}

function render(){
  const a=alive(),o=S.players.filter(p=>p.outWeek!=null);
  let h="";
  if(loadFailed)h+='<p class="sub">⚠️ Couldn\'t load the latest data. Refresh to try again.</p>';
  if(DB)h+=`<div class="bar"><span class="sub" style="margin:0">${admin?"Organiser mode":"Read-only view"}</span><button class="link" data-a="${admin?"logout":"login"}">${admin?"Log out":"Organiser login"}</button></div>`;
  h+=`<div class="stats"><div class="stat"><b>${S.week}</b><span>Gameweek</span></div><div class="stat"><b>${a.length}</b><span>Still in</span></div><div class="stat"><b>${o.length}</b><span>Out</span></div></div>`;
  if(S.players.length&&a.length===1&&S.week>1)h+=`<div class="banner">🏆 Winner: ${esc(a[0].name)}</div>`;
  else if(S.players.length&&a.length===0)h+=`<div class="banner">Everyone's out!</div>`;
  if(admin)h+=`<div class="row"><input type="text" id="newName" placeholder="Add player name" maxlength="40"><button class="primary" data-a="add">Add</button></div>`;
  h+=`<h2>Gameweek ${S.week} – players still in</h2>`;
  if(!a.length)h+=`<div class="empty">No players yet.</div>`;
  a.forEach(p=>{
    const pk=p.picks[S.week]||{};
    const prev=Object.keys(p.picks).filter(w=>+w<S.week).map(w=>`<span class="chip">GW${w}: ${esc(p.picks[w].team||"–")}</span>`).join("");
    h+=`<div class="player"><div class="top"><span class="name">${esc(p.name)}</span>${admin?`<button class="link" data-a="del" data-id="${p.id}">Remove</button>`:""}</div>`;
    if(admin)h+=`<div class="row"><input type="text" placeholder="Team picked" value="${esc(pk.team||"")}" data-a="pick" data-id="${p.id}">
    <button class="win ${pk.result==="win"?"on":""}" data-a="res" data-r="win" data-id="${p.id}">Win</button>
    <button class="out ${pk.result==="out"?"on":""}" data-a="res" data-r="out" data-id="${p.id}">Out</button></div>`;
    else h+=`<div class="row" style="align-items:center"><span>${esc(pk.team||"No pick yet")}</span>${pk.result?`<span class="badge ${pk.result}">${pk.result==="win"?"Win":"Out"}</span>`:""}</div>`;
    h+=prev?`<div class="chips">${prev}</div></div>`:`</div>`;
  });
  if(admin&&a.length)h+=`<div class="actions"><button class="primary" data-a="close">Close gameweek ${S.week} →</button></div>`;
  if(o.length){
    h+=`<h2>Eliminated</h2>`;
    o.sort((x,y)=>y.outWeek-x.outWeek).forEach(p=>{
      const ch=Object.keys(p.picks).map(w=>`<span class="chip">GW${w}: ${esc(p.picks[w].team||"–")}</span>`).join("");
      h+=`<div class="player elim"><div class="top"><span class="name">${esc(p.name)} <span class="chip">out GW${p.outWeek}</span></span>${admin?`<button class="link" data-a="revive" data-id="${p.id}">Reinstate</button>`:""}</div><div class="chips">${ch}</div></div>`;
    });
  }
  if(admin)h+=`<div class="actions"><button data-a="reset">Reset competition</button></div>`;
  const f=document.activeElement&&document.activeElement.id;
  let el=document.getElementById("app");if(!el){el=document.createElement("div");el.id="app";document.body.appendChild(el)}el.innerHTML=h;
  if(f==="newName")document.getElementById("newName").focus();
}

const get=id=>S.players.find(p=>p.id==id);
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,p=get(b.dataset.id);
  if(a==="login"){
    const x=prompt("Organiser password");if(!x)return;
    await load();pw=x;
    if(await save()){admin=true;try{localStorage.setItem("lms-pw",pw)}catch(e){}}else pw="";
    render();return;
  }
  if(a==="logout"){admin=false;pw="";try{localStorage.removeItem("lms-pw")}catch(e){}render();return}
  if(!admin)return;
  if(a==="add")addPlayer();
  else if(a==="del"&&confirm(`Remove ${p.name}?`)){S.players=S.players.filter(x=>x!==p)}
  else if(a==="res"){const k=p.picks[S.week]=p.picks[S.week]||{};k.result=k.result===b.dataset.r?null:b.dataset.r}
  else if(a==="revive"){p.outWeek=null}
  else if(a==="close")closeWeek();
  else if(a==="reset"){if(confirm("Clear all players and start over?"))S={week:1,players:[]}}
  render();save();
});
document.addEventListener("change",e=>{
  const i=e.target;if(i.dataset.a!=="pick"||!admin)return;
  const p=get(i.dataset.id),t=i.value.trim();
  const dup=t&&Object.keys(p.picks).find(w=>+w!==S.week&&norm(p.picks[w].team||"")===norm(t));
  if(dup){alert(`${p.name} already used ${t} in gameweek ${dup}.`);i.value="";return}
  const k=p.picks[S.week]=p.picks[S.week]||{};k.team=t;save();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newName"&&admin){addPlayer();render();save()}});

function addPlayer(){
  const n=document.getElementById("newName").value.trim();
  if(!n)return;
  S.players.push({id:Date.now()+Math.random().toString(36).slice(2,5),name:n,outWeek:null,picks:{}});
}
function closeWeek(){
  const a=alive(),pending=a.filter(p=>!(p.picks[S.week]&&p.picks[S.week].result));
  if(pending.length&&!confirm(`${pending.length} player(s) have no result and will be eliminated. Continue?`))return;
  a.forEach(p=>{const k=p.picks[S.week];if(!k||k.result!=="win")p.outWeek=S.week});
  S.week++;
}
function start(){render();load().then(render)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
if(DB)setInterval(async()=>{if(!admin&&!document.hidden){await load();render()}},15000);
</script>
</body>
</html>
